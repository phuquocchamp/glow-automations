# =============================================================================
# Moodle Time Tracker — Default Configuration
# =============================================================================

# ⚠️  KEEP THIS FILE PRIVATE — contains Moodle login credentials.

# --- Moodle Connection ---
moodle:
  base_url: "https://glow.paclinks.org"
  username: "your_username_here"
  password: "your_password_here"
  # Server timezone offset (hours from UTC).
  # Vietnam = 7 (UTC+7). Used to calculate correct unix timestamp per day.
  timezone_offset: 7

# --- General Config ---
general:
  year: 2026
  month: 3

# --- Session Detection ---
session:
  # Maximum gap (seconds) between two consecutive events to be in the same session.
  # If gap >= threshold → new session starts.
  default_threshold_sec: 900 # 15 mins

  # Higher threshold for media content (H5P, Page, URL, File).
  # Prevents splitting sessions when a student watches a long video.
  media_threshold_sec: 1200 # 20 mins

  # Maximum bonus (seconds) added to the end of each session.
  # Formula: bonus = min(median_gap_in_session, max_bonus_sec)
  # Self-adjusts to actual click patterns — not a fixed value like AR (half timeout).
  max_bonus_sec: 600 # 10 mins

  # Sessions shorter than this value (seconds) are discarded.
  min_session_sec: 180 # 3 mins

  # Sessions with fewer than X events are discarded (removes 1-click sessions).
  min_events_per_session: 2

# --- Anomaly Detection ---
anomaly:
  # Flag if session has > X events/hour.
  # Basicaly 10 events in 1 min => 600 events/hour → likely a bot or auto-refresh pattern.
  max_events_per_hour: 300

  # Flag auto-refresh if std_dev(gaps) < X seconds.
  min_gap_std_threshold: 1.5

  # Regular gap +/- tolerance seconds → auto-refresh pattern.
  auto_refresh_tolerance_sec: 2.0

  # Flag if session has > X unique IP addresses.
  max_ips_per_session: 3

# --- Content Classification ---
content:
  # Components treated as "media" → use media_threshold instead of default.
  media_components:
    - H5P
    - Page
    - URL
    - File

  # Event names to exclude entirely (system noise).
  exclude_event_names:
    - "User login failed"
    - "Log report viewed"
    - "Live logs"

# --- Reporting ---
reporting:
  # Base URL of the Moodle site — used to generate log links per user.
  # Example: https://elearning.example.com
  # If empty, falls back to moodle.base_url above.
  moodle_base_url: ""
